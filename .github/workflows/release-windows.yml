name: Publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confirm tag matches package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match package version v$version."
          }

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Build Windows installer and portable app
        run: npm run dist:win

      - name: Generate and verify SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Name -match '^Chronos-.*-(Setup|Portable)\.exe$' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content release/SHA256SUMS.txt
          ./scripts/verify-windows-artifacts.ps1

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(
            (Get-ChildItem release -File -Filter '*-Setup.exe').FullName
            (Get-ChildItem release -File -Filter '*-Portable.exe').FullName
            (Get-ChildItem release -File -Filter '*-Setup.exe.blockmap').FullName
            (Join-Path $PWD 'release/latest.yml')
            (Join-Path $PWD 'release/SHA256SUMS.txt')
          )
          if ($assets.Count -ne 5 -or @($assets | Where-Object { -not (Test-Path -LiteralPath $_) }).Count -gt 0) {
            throw 'Expected both Windows packages, the installer blockmap, latest.yml and checksums.'
          }
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "Chronos $env:RELEASE_TAG" --generate-notes
